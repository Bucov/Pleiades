{% extends 'base.html' %}

{% block head %}
<title>Search - Pleiades</title>
{% endblock %}

{% block body %}
<h1 class="typed">search</h1>

<form action="/search" method="POST">
    <input type="text" name="query" placeholder="title" autofocus>
    <input type="submit" value="go">
</form>

{% if result is defined %}
{% if result %}
<ul class="results">
    {% for manga in result %}
    <li><a href="{{ url_for('manga', id=manga.id) }}">{{ manga.title }}</a></li>
    {% endfor %}
</ul>
{% else %}
<p class="empty">nothing found</p>
{% endif %}
{% endif %}

{% endblock %}
