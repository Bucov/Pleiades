{% extends 'base.html' %}

{% block head %}
<title>Manga Recommender</title>
{% endblock %}

{% block body %}
<h1 style="text-align: center;">Search</h1>

<div class="search-form">
    <form action="/search" method="POST">
        <input type="text" name="query" placeholder="Search for manga...">
        <input type="submit" value="test">
    </form>

    {% for manga in result %}
    <p>{{ manga }}</p>
    {% endfor %}
</div>



{% endblock %}
